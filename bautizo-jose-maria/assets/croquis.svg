<svg class="croquis-svg" viewBox="0 0 600 517" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="croquis-title croquis-desc">
<title id="croquis-title">Croquis: iglesia y estacionamiento recomendado</title>
<desc id="croquis-desc">El Exconvento de Santa María Magdalena está sobre la Avenida Libertad Sur, en la esquina con la Calle Mújica y Osorio. Plaza La Estación, con estacionamiento de pago, está sobre Mújica y Osorio, a unos 100 metros al poniente de la iglesia.</desc>
